name: Build NoEdge

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build NoEdge WinForms
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show repository files
        shell: pwsh
        run: |
          Write-Host "Repository workspace:"
          Write-Host $env:GITHUB_WORKSPACE
          Write-Host ""
          Write-Host "Files found in repository:"
          Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Force |
            Select-Object FullName |
            Format-Table -AutoSize

      - name: Find NoEdge project file
        shell: pwsh
        run: |
          $project = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Filter "NoEdge.WinForms.csproj" `
            -Recurse `
            -File |
            Select-Object -First 1

          if ($null -eq $project) {
            throw @"
          NoEdge.WinForms.csproj was not found.

          Make sure this file exists in GitHub and was committed:
          NoEdge.WinForms.csproj

          It may be in the repository root or inside:
          NoEdge.WinForms/NoEdge.WinForms.csproj
          "@
          }

          Write-Host "Project found: $($project.FullName)"

          "PROJECT_PATH=$($project.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Show .NET environment
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_PATH"

      - name: Build Release version
        shell: pwsh
        run: |
          dotnet build `
            "$env:PROJECT_PATH" `
            --configuration Release `
            --no-restore

      - name: Publish Windows x64 build
        shell: pwsh
        run: |
          dotnet publish `
            "$env:PROJECT_PATH" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output "$env:GITHUB_WORKSPACE\publish" `
            --no-restore

      - name: Upload NoEdge build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoEdge-win-x64
          path: publish
          if-no-files-found: error